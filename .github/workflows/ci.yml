# Проверки до слияния в main: линтер, тесты логики, типы и сборка на каждом push в dev и в Pull Request
name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit # тесты логики (Vitest), без браузера
      - run: npm run build # включает проверку типов (tsc -b)
