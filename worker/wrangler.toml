# API игры: Cloudflare Workers + D1. Настройка — worker/README.md
name = "sky-defender-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://toninov.github.io,http://localhost:5173"
APP_URL = "" # ссылка на мини-апп из BotFather, например https://t.me/<бот>/<приложение>; пусто — «Поделиться» выключено

[[d1_databases]]
binding = "DB"
database_name = "sky-defender"
database_id = "ee46e79d-7baf-490f-8368-f4302eb06dfa"
migrations_dir = "migrations"
